name: Build

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "tests/**"
      - ".github/workflows/build.yml"
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "tests/**"
      - ".github/workflows/build.yml"

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  
permissions:
  contents: read # This is required for actions/checkout
  checks: write # This is required for dorny/test-reporter
  id-token: write # This is required for requesting the JWT
  pull-requests: write # This is required for commenting on PRs

defaults:
  run:
    working-directory: ./src

jobs:
  build:
    if: "!contains(github.event.head_commit.message, 'skip-ci')"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        working-directory: ./tests
        run: dotnet test --verbosity normal --collect:"XPlat Code Coverage" --logger "trx;LogFileName=test_results.trx" --logger "console;verbosity=detailed" --results-directory ./coverage
  
      - name: Generate coverage report
        working-directory: ./tests
        run: |
          dotnet tool install dotnet-reportgenerator-globaltool
          dotnet tool run reportgenerator -reports:"coverage/**/coverage.cobertura.xml" -targetdir:"coverage-report" -reporttypes:"Cobertura;MarkdownSummaryGithub"

      - name: Create Test Report
        uses: dorny/test-reporter@v3
        if: always()
        with:
          name: Tests
          path: "**/*.trx" # Path to test results (inside artifact .zip)
          reporter: dotnet-trx # Format of test results

      - name: Add Coverage Report to Job Summary
        if: always()
        working-directory: ./tests
        run: |
          if [ -f "coverage-report/SummaryGithub.md" ]; then
            echo "## 📊 Code Coverage Report" >> $GITHUB_STEP_SUMMARY
            cat coverage-report/SummaryGithub.md >> $GITHUB_STEP_SUMMARY
          else
            echo "## ⚠️ No Coverage Report Generated" >> $GITHUB_STEP_SUMMARY
            echo "Coverage report file not found at coverage-report/SummaryGithub.md" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Code Coverage Report
        if: github.event_name == 'pull_request'
        uses: 5monkeys/cobertura-action@master
        with:
          path: tests/coverage-report/Cobertura.xml
          minimum_coverage: 75
          fail_below_threshold: false
          show_line: true
          show_branch: true
          show_missing: true
          link_missing_lines: true
          only_changed_files: true
          
  run:
    runs-on: ubuntu-latest
    environment: azure_prod
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Run Regions
        run: dotnet run -- regions -o markdown --quiet ${{ runner.debug == '1' && '--no-color --debug' || '' }} >> $GITHUB_STEP_SUMMARY

      - name: Azure Login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Run Integration Tests
        run: dotnet run -- nsg -s ${{ secrets.AZURE_SUBSCRIPTION_ID }} -o markdown --quiet ${{ runner.debug == '1' && '--no-color --debug' || '' }} >> $GITHUB_STEP_SUMMARY

      - name: Run Advisor Integration Test
        run: dotnet run -- advisor -s ${{ secrets.AZURE_SUBSCRIPTION_ID }} -o markdown --quiet ${{ runner.debug == '1' && '--no-color --debug' || '' }} >> $GITHUB_STEP_SUMMARY

      - name: Run Route Tables Integration Test
        run: dotnet run -- route-tables -s ${{ secrets.AZURE_SUBSCRIPTION_ID }} -o markdown --quiet ${{ runner.debug == '1' && '--no-color --debug' || '' }} >> $GITHUB_STEP_SUMMARY
